name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-1
  LAMBDA_FUNCTION_NAME: ${{ vars.BACKEND_LAMBDA_FUNCTION_NAME || 'genai-in-business-dev-backend' }}

jobs:
  deploy:
    name: Test, package, and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          grep -iv "^pywin32\|^-r " requirements-dev.txt > requirements-dev-ci.txt
          python -m pip install -r requirements-dev-ci.txt
          rm requirements-dev-ci.txt

      - name: Run tests
        run: pytest
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: ap-northeast-1

      - name: Build deployment package
        run: |
          rm -rf package deploy.zip
          mkdir -p package
          python -m pip install -r requirements.txt -t package
          cp -R app package/app

      - name: Archive deployment package
        run: |
          cd package
          zip -r ../deploy.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://deploy.zip

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated-v2 \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"
